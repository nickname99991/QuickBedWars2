name: Build QuickBedWars

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Download Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
          unzip -q gradle-2.14.1-bin.zip

      - name: Find Project ZIP
        run: |
          echo "===== ZIP FILES ====="
          find . -type f -name "*.zip" ! -name "gradle-2.14.1-bin.zip" -print

          ZIP=$(find . -type f -name "*.zip" ! -name "gradle-2.14.1-bin.zip" -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Project ZIP not found!"
            exit 1
          fi

          echo "Using project ZIP: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract Project
        run: |
          rm -rf project
          mkdir project
          unzip -q "$ZIP" -d project

          echo "===== PROJECT FILES ====="
          find project -maxdepth 5 -type f | sort

      - name: Find Java File
        run: |
          FILE=$(find project -name "QuickBedWars.java" -print -quit)

          if [ -z "$FILE" ]; then
            echo "ERROR: QuickBedWars.java not found!"
            exit 1
          fi

          echo "Java file: $FILE"
          echo "JAVA_FILE=$FILE" >> "$GITHUB_ENV"

      - name: Fix ClientRegistry
        run: |
          sed -i 's/import net.minecraftforge.client.ClientRegistry;/import net.minecraftforge.fml.client.registry.ClientRegistry;/' "$JAVA_FILE"

          echo "===== CHECKING IMPORT ====="
          grep "ClientRegistry" "$JAVA_FILE"

      - name: Find Gradle Project
        run: |
          BUILD_FILE=$(find project -name "build.gradle" -print -quit)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")

          echo "Gradle project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build Mod
        run: |
          cd "$PROJECT_DIR"
          "$GITHUB_WORKSPACE/gradle-2.14.1/bin/gradle" build --no-daemon

      - name: Find Mod JAR
        run: |
          echo "===== SEARCHING FOR MOD JAR ====="

          JAR=$(find project -type f -path "*/build/libs/*.jar" \
            ! -name "*sources*" \
            ! -name "*dev*" \
            -print -quit)

          if [ -z "$JAR" ]; then
            echo "ERROR: Mod JAR not found!"

            echo "===== ALL JARS ====="
            find project -type f -name "*.jar" | sort

            exit 1
          fi

          echo "Mod JAR found: $JAR"
          cp "$JAR" QuickBedWars.jar

      - name: Upload Mod
        uses: actions/upload-artifact@v4
        with:
          name: QuickBedWars
          path: QuickBedWars.jar
          if-no-files-found: error
